name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    name: Prepare draft release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "draft release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --draft \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi

  riscv:
    name: ${{ matrix.project }}
    needs: prepare-release
    if: ${{ always() && !cancelled() && needs.prepare-release.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: yolo_stream
            binary: stream_yolo
          - project: yolo_face
            binary: face_stream
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git curl unzip patch

      - name: Cache downloaded dependencies
        uses: actions/cache@v4
        with:
          path: ${{ matrix.project }}/.deps
          key: deps-v2-${{ matrix.project }}-${{ hashFiles(format('{0}/scripts/fetch-deps.sh', matrix.project), format('{0}/scripts/build-opencv.sh', matrix.project), format('{0}/patches/*.patch', matrix.project)) }}
          restore-keys: |
            deps-v2-${{ matrix.project }}-

      - name: Fetch toolchain, SDK and OpenCV source
        working-directory: ${{ matrix.project }}
        run: ./scripts/fetch-deps.sh

      - name: Build OpenCV with CVI backend
        working-directory: ${{ matrix.project }}
        run: ./scripts/build-opencv.sh

      - name: Build application
        working-directory: ${{ matrix.project }}
        run: ./scripts/build.sh

      - name: Package board bundle
        run: |
          mkdir -p out
          scripts/package-board.sh \
            "${{ matrix.project }}" \
            "${{ matrix.project }}/build/bin/${{ matrix.binary }}" \
            out

      - name: Publish board package to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "out/${{ matrix.project }}-board.tar.gz" \
            "out/${{ matrix.project }}-board.tar.gz.sha256" \
            --clobber

      - name: Write job summary
        run: |
          {
            echo "### ${{ matrix.project }}"
            echo ""
            echo '```'
            ls -lh out
            tar -tzf "out/${{ matrix.project }}-board.tar.gz"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  studio-linux:
    name: yolo_studio (Linux x86_64)
    needs: prepare-release
    if: ${{ always() && !cancelled() && needs.prepare-release.result != 'failure' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: yolo_studio/requirements.txt

      - name: Install Qt/X11 runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libfontconfig1 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-util1

      - name: Install Python dependencies
        working-directory: yolo_studio
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build slim one-file executable
        working-directory: yolo_studio
        run: python tools/build_desktop.py --mode onefile

      - name: Smoke test slim build
        working-directory: yolo_studio
        run: |
          QT_QPA_PLATFORM=offscreen timeout 60s ./dist/LicheeYOLOStudio --smoke-test

      - name: Package slim build
        working-directory: yolo_studio
        run: |
          mkdir -p ../out
          stage=$(mktemp -d)
          cp dist/LicheeYOLOStudio "$stage/"
          cp ../LICENSES/LGPL-3.0.txt ../THIRD_PARTY_NOTICES.md "$stage/"
          tar -C "$stage" -czf ../out/yolo_studio-linux-x86_64.tar.gz .
          rm -rf "$stage"
          cd ../out
          sha256sum yolo_studio-linux-x86_64.tar.gz > yolo_studio-linux-x86_64.tar.gz.sha256

      - name: Install ML stack for the full build
        run: |
          # CPU-only torch: the PyPI Linux wheel pulls several GB of CUDA.
          python -m pip install torch torchvision \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ultralytics onnx onnxruntime onnxslim

      - name: Build full one-folder bundle (torch inside)
        working-directory: yolo_studio
        run: python tools/build_desktop.py --mode onedir --with-ml

      - name: Smoke test full build
        working-directory: yolo_studio
        run: |
          QT_QPA_PLATFORM=offscreen timeout 60s \
            ./dist/LicheeYOLOStudio-full/LicheeYOLOStudio-full --smoke-test
          timeout 300s ./dist/LicheeYOLOStudio-full/LicheeYOLOStudio-full --have-ml

      - name: Test ONNX export from the full build
        working-directory: yolo_studio
        run: |
          python -c "from ultralytics import YOLO; YOLO('yolo11n.pt')"
          QT_QPA_PLATFORM=offscreen timeout 300s \
            ./dist/LicheeYOLOStudio-full/LicheeYOLOStudio-full --export-onnx yolo11n.pt 320
          python - <<'PY'
          import onnx
          m = onnx.load("yolo11n.onnx")
          names = [o.name for o in m.graph.output]
          print("outputs:", names)
          assert len(names) == 6, names
          PY

      - name: Package full build
        working-directory: yolo_studio
        run: |
          mkdir -p ../out
          tar -C dist -czf ../out/yolo_studio-linux-x86_64-full.tar.gz \
            LicheeYOLOStudio-full
          cd ../out
          sha256sum yolo_studio-linux-x86_64-full.tar.gz \
            > yolo_studio-linux-x86_64-full.tar.gz.sha256
          ls -lh

      - name: Publish Linux packages to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            out/yolo_studio-linux-x86_64.tar.gz \
            out/yolo_studio-linux-x86_64.tar.gz.sha256 \
            out/yolo_studio-linux-x86_64-full.tar.gz \
            out/yolo_studio-linux-x86_64-full.tar.gz.sha256 \
            --clobber

  studio-windows:
    name: yolo_studio (Windows x86_64)
    needs: prepare-release
    if: ${{ always() && !cancelled() && needs.prepare-release.result != 'failure' }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: yolo_studio/requirements.txt

      - name: Install Python dependencies
        working-directory: yolo_studio
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build slim one-file executable
        working-directory: yolo_studio
        run: python tools/build_desktop.py --mode onefile

      - name: Smoke test slim build
        working-directory: yolo_studio
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath ".\dist\LicheeYOLOStudio.exe" `
            -ArgumentList "--smoke-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            throw "smoke test failed with exit code $($p.ExitCode)"
          }

      - name: Package slim build
        working-directory: yolo_studio
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ..\out | Out-Null
          $stage = Join-Path $env:RUNNER_TEMP "stage-slim"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item dist\LicheeYOLOStudio.exe $stage
          Copy-Item ..\LICENSES\LGPL-3.0.txt, ..\THIRD_PARTY_NOTICES.md $stage
          tar -C $stage -czf ..\out\yolo_studio-windows-x86_64.tar.gz .
          Get-FileHash ..\out\yolo_studio-windows-x86_64.tar.gz -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  yolo_studio-windows-x86_64.tar.gz" } |
            Set-Content -Encoding ascii ..\out\yolo_studio-windows-x86_64.tar.gz.sha256

      - name: Install ML stack for the full build
        run: python -m pip install ultralytics onnx onnxruntime onnxslim

      - name: Build full one-folder bundle (torch inside)
        working-directory: yolo_studio
        run: python tools/build_desktop.py --mode onedir --with-ml

      - name: Smoke test full build
        working-directory: yolo_studio
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath ".\dist\LicheeYOLOStudio-full\LicheeYOLOStudio-full.exe" `
            -ArgumentList "--smoke-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            throw "smoke test failed with exit code $($p.ExitCode)"
          }
          $p = Start-Process -FilePath ".\dist\LicheeYOLOStudio-full\LicheeYOLOStudio-full.exe" `
            -ArgumentList "--have-ml" -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            throw "the full build does not contain ultralytics (exit $($p.ExitCode))"
          }

      - name: Test ONNX export from the full build
        working-directory: yolo_studio
        shell: pwsh
        run: |
          python -c "from ultralytics import YOLO; YOLO('yolo11n.pt')"
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath ".\dist\LicheeYOLOStudio-full\LicheeYOLOStudio-full.exe" `
            -ArgumentList "--export-onnx","yolo11n.pt","320" -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            throw "ONNX export failed with exit code $($p.ExitCode)"
          }
          python -c "import onnx; m=onnx.load('yolo11n.onnx'); names=[o.name for o in m.graph.output]; print('outputs:', names); assert len(names)==6, names"

      - name: Package full build
        working-directory: yolo_studio
        shell: pwsh
        run: |
          tar -C dist -czf ..\out\yolo_studio-windows-x86_64-full.tar.gz LicheeYOLOStudio-full
          Get-FileHash ..\out\yolo_studio-windows-x86_64-full.tar.gz -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  yolo_studio-windows-x86_64-full.tar.gz" } |
            Set-Content -Encoding ascii ..\out\yolo_studio-windows-x86_64-full.tar.gz.sha256
          Get-ChildItem ..\out | Format-Table Name, Length

      - name: Publish Windows packages to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload $env:GITHUB_REF_NAME `
            out/yolo_studio-windows-x86_64.tar.gz `
            out/yolo_studio-windows-x86_64.tar.gz.sha256 `
            out/yolo_studio-windows-x86_64-full.tar.gz `
            out/yolo_studio-windows-x86_64-full.tar.gz.sha256 `
            --clobber

  release:
    name: Publish release
    if: ${{ startsWith(github.ref, 'refs/tags/v') && success() }}
    needs: [prepare-release, riscv, studio-linux, studio-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Add SHA256SUMS.txt and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh release download "$GITHUB_REF_NAME" --dir release
          rm -f release/SHA256SUMS.txt
          (
            cd release
            find . -maxdepth 1 -type f -printf '%f\n' | sort | \
              xargs -r sha256sum > SHA256SUMS.txt
            ls -lh
          )
          gh release upload "$GITHUB_REF_NAME" \
            release/SHA256SUMS.txt --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
          echo "published https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
